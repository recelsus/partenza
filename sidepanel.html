<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Partenza Side Panel</title>
    <link rel="stylesheet" href="popup/panel.css">
  </head>
  <body class="side-panel-window">
    <div class="shell side-panel-shell">
      <div class="hero"></div>

      <div class="toolbar">
        <div class="row">
          <select id="source_select"></select>
          <button id="refresh_button">更新</button>
          <button id="add_tab_button">Add Tab</button>
        </div>
        <div class="search-row">
          <input id="search_input" type="search" placeholder="Search bookmarks">
        </div>
      </div>

      <div id="list_view" class="panel">
        <div class="section-title">
          <span id="bookmark_count"></span>
          <div class="section-actions">
            <span id="active_tag_label" class="filter-label" hidden></span>
            <button id="export_button" class="section-button" hidden>Export</button>
            <button id="start_sort_button" class="section-button" hidden>Sort</button>
            <button id="save_sort_button" class="section-button" hidden>Save order</button>
            <button id="cancel_sort_button" class="section-button subtle-button" hidden>Cancel</button>
            <button id="edit_title_button" class="section-button" hidden>Edit</button>
          </div>
        </div>
        <ul id="bookmarks_list"></ul>
      </div>

      <div id="edit_view" class="panel" hidden>
        <div class="edit-toolbar">
          <button id="back_to_list_button" class="subtle-button">Back</button>
          <span class="edit-title">Edit Bookmark</span>
          <div class="edit-actions">
            <button id="save_bookmark_button">Save</button>
          </div>
        </div>

        <div class="form-stack">
          <div class="field-group">
            <label class="field-label" for="edit_target_source_select">File</label>
            <select id="edit_target_source_select"></select>
            <span id="edit_target_source_hint" class="field-hint"></span>
          </div>

          <div class="field-group">
            <label class="field-label" for="edit_bookmark_title">Title</label>
            <input id="edit_bookmark_title" type="text" maxlength="240">
          </div>

          <div class="field-group">
            <label class="field-label" for="edit_bookmark_url">URL</label>
            <input id="edit_bookmark_url" type="url" maxlength="2048">
          </div>

          <div class="field-group">
            <span class="field-label">Tags</span>
            <div class="tag-input-grid">
              <input id="edit_bookmark_tag_1" type="text" maxlength="40" placeholder="Tag 1">
              <input id="edit_bookmark_tag_2" type="text" maxlength="40" placeholder="Tag 2">
              <input id="edit_bookmark_tag_3" type="text" maxlength="40" placeholder="Tag 3">
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="edit_bookmark_note">Note</label>
            <textarea id="edit_bookmark_note"></textarea>
          </div>
        </div>
      </div>

      <div id="export_view" class="panel" hidden>
        <div class="edit-toolbar">
          <button id="back_from_export_button" class="subtle-button">Back</button>
          <span class="edit-title">Export To GitHub</span>
          <div class="edit-actions">
            <button id="save_export_button">Export</button>
          </div>
        </div>

        <div class="form-stack">
          <div class="field-group">
            <label class="field-label" for="export_target_source_select">GitHub Target</label>
            <select id="export_target_source_select"></select>
            <span id="export_target_source_hint" class="field-hint"></span>
          </div>

          <div class="field-group">
            <label class="field-label" for="export_file_name">New File Name</label>
            <input id="export_file_name" type="text" maxlength="120" placeholder="work.json">
            <span class="field-hint">Created as a new file under <code>bookmarks/</code>.</span>
          </div>
        </div>
      </div>

      <div id="status"></div>
    </div>

    <script type="module" src="popup/main.js"></script>
  </body>
</html>
